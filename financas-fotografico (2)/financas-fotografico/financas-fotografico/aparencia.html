     </p>
    </div>
    <div class="dropdown">
     <button aria-expanded="false" class="botao-perfil dropdown-toggle" data-bs-toggle="dropdown" type="button">

   <main class="conteudo-principal">
    <section class="painel">
     <h2>
      Preferências de exibição
     </h2>
     <form id="formulario-aparencia">
      <div class="grupo-campo">
       <label for="tema">
        Tema
       </label>
       <select class="form-select" id="tema" name="tema">
        <option value="claro">
         Claro
        </option>
        <option value="escuro">
         Escuro
        </option>
        <option value="automatico">
         Automático
        </option>
       </select>
      </div>
      <div class="grupo-campo">
       <label for="formato-data">
        Formato de data
       </label>
       <select class="form-select" id="formato-data" name="formato-data">
        <option value="br">
         dd/mm/aaaa
        </option>
        <option value="iso">
         aaaa-mm-dd
        </option>
       </select>
      </div>
      <div class="grupo-campo">
       <label for="moeda">
        Moeda
       </label>
       <select class="form-select" id="moeda" name="moeda">
        <option value="BRL">
         Real brasileiro (R$)
        </option>
       </select>
      </div>
      <button class="btn botao-principal" type="submit">
       Salvar preferências
      </button>
     </form>
    </section>
   </main>
